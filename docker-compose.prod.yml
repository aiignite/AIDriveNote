version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: "${POSTGRES_DB:-ai_drive_note}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_drive_note}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - appnet

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
      DATABASE_URL_SYNC: "${DATABASE_URL_SYNC:?DATABASE_URL_SYNC is required}"
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY is required}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3270}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      SSO_ENABLED: "${SSO_ENABLED:-false}"
      SSO_SECRET_KEY: "${SSO_SECRET_KEY:-}"
      SSO_ISSUER: "${SSO_ISSUER:-aidriveall}"
      # 语音转写：remote 模式指向本 compose 内的 asr_gateway 容器
      NOTE_ASR_MODE: "${NOTE_ASR_MODE:-remote}"
      NOTE_ASR_REMOTE_URL: "${NOTE_ASR_REMOTE_URL:-http://asr_gateway:8090/api/v1/transcribe}"
      NOTE_ASR_REMOTE_API_KEY: "${NOTE_ASR_REMOTE_API_KEY:-}"
      NOTE_ASR_REMOTE_TIMEOUT: "${NOTE_ASR_REMOTE_TIMEOUT:-3600}"
      NOTE_ASR_FALLBACK_LOCAL: "${NOTE_ASR_FALLBACK_LOCAL:-false}"
      # local 兜底/降级参数（无 GPU 用 cpu/int8）
      NOTE_WHISPER_MODEL: "${NOTE_WHISPER_MODEL:-small}"
      NOTE_WHISPER_LANGUAGE: "${NOTE_WHISPER_LANGUAGE:-zh}"
      NOTE_WHISPER_DEVICE: "${NOTE_WHISPER_DEVICE:-cpu}"
      NOTE_WHISPER_COMPUTE_TYPE: "${NOTE_WHISPER_COMPUTE_TYPE:-int8}"
    ports:
      - "127.0.0.1:3275:3275"
    volumes:
      - uploads_data:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - appnet

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        NGINX_SUBPATH: ${NGINX_SUBPATH:-0}
    restart: unless-stopped
    ports:
      - "3270:80"
    depends_on:
      - backend
    networks:
      - appnet

  # ── 语音转写网关（本机 CPU 推理：small + int8）──
  # 说明：网关使用自身 ASR_* 变量；ASR_API_KEY 复用 backend 的 NOTE_ASR_REMOTE_API_KEY，
  #       只需配置一个密钥即可双向对齐。backend 经服务名访问 http://asr_gateway:8090。
  asr_gateway:
    build:
      context: ./asr_gateway
      dockerfile: Dockerfile
      args:
        # 构建期预下载的权重规格，与运行期 ASR_MODEL 保持一致可避免二次下载
        ASR_PRELOAD_MODEL: ${ASR_MODEL:-small}
    restart: unless-stopped
    environment:
      ASR_API_KEY: "${NOTE_ASR_REMOTE_API_KEY:?NOTE_ASR_REMOTE_API_KEY is required}"
      ASR_MODEL: "${ASR_MODEL:-small}"
      ASR_LANGUAGE: "${ASR_LANGUAGE:-zh}"
      ASR_DEVICE: "${ASR_DEVICE:-cpu}"
      ASR_COMPUTE_TYPE: "${ASR_COMPUTE_TYPE:-int8}"
      ASR_PRELOAD: "${ASR_PRELOAD:-1}"
    # 资源上限：本机仅 2 核 / 3.6GB，限制转写占用以免拖垮笔记接口
    mem_limit: ${ASR_MEM_LIMIT:-1536m}
    cpus: ${ASR_CPUS:-1.5}
    ports:
      # 仅回环暴露，便于本机调试：curl -H "X-API-Key: ..." http://127.0.0.1:8091/health
      - "127.0.0.1:8091:8090"
    networks:
      - appnet

volumes:
  postgres_data:
  uploads_data:

networks:
  appnet:
    driver: bridge
