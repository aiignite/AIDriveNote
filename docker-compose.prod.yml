version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: "${POSTGRES_DB:-ai_drive_note}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_drive_note}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - appnet

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
      DATABASE_URL_SYNC: "${DATABASE_URL_SYNC:?DATABASE_URL_SYNC is required}"
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY is required}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3270}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      SSO_ENABLED: "${SSO_ENABLED:-false}"
      SSO_SECRET_KEY: "${SSO_SECRET_KEY:-}"
      SSO_ISSUER: "${SSO_ISSUER:-aidriveall}"
      # 语音转写：remote 模式指向局域网 asr_gateway（见文件末尾注释）
      NOTE_ASR_MODE: "${NOTE_ASR_MODE:-remote}"
      NOTE_ASR_REMOTE_URL: "${NOTE_ASR_REMOTE_URL:-}"
      NOTE_ASR_REMOTE_API_KEY: "${NOTE_ASR_REMOTE_API_KEY:-}"
      NOTE_ASR_REMOTE_TIMEOUT: "${NOTE_ASR_REMOTE_TIMEOUT:-3600}"
      NOTE_ASR_FALLBACK_LOCAL: "${NOTE_ASR_FALLBACK_LOCAL:-false}"
      # local 兜底/降级参数（无 GPU 用 cpu/int8）
      NOTE_WHISPER_MODEL: "${NOTE_WHISPER_MODEL:-medium}"
      NOTE_WHISPER_LANGUAGE: "${NOTE_WHISPER_LANGUAGE:-zh}"
      NOTE_WHISPER_DEVICE: "${NOTE_WHISPER_DEVICE:-cpu}"
      NOTE_WHISPER_COMPUTE_TYPE: "${NOTE_WHISPER_COMPUTE_TYPE:-int8}"
    ports:
      - "127.0.0.1:3275:3275"
    volumes:
      - uploads_data:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - appnet

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        NGINX_SUBPATH: ${NGINX_SUBPATH:-0}
    restart: unless-stopped
    ports:
      - "3270:80"
    depends_on:
      - backend
    networks:
      - appnet

  # ── 局域网语音转写网关（可选，默认注释；需要 GPU 转写时取消注释）──
  # 说明：网关为独立服务，使用自身 ASR_* 变量；需与 backend 的 NOTE_ASR_* 对应。
  # 端口默认映射 8091:8090，避免与应用端口冲突。宿主机需装 ffmpeg、并准备 CUDA。
  # asr_gateway:
  #   build:
  #     context: ./asr_gateway
  #     dockerfile: Dockerfile          # 如无 Dockerfile，可改用下方 image
  #   # image: aidrivenote/asr-gateway:latest
  #   restart: unless-stopped
  #   environment:
  #     ASR_API_KEY: "${NOTE_ASR_REMOTE_API_KEY:?NOTE_ASR_REMOTE_API_KEY is required}"
  #     ASR_MODEL: "${ASR_MODEL:-medium}"
  #     ASR_LANGUAGE: "${ASR_LANGUAGE:-zh}"
  #     ASR_DEVICE: "${ASR_DEVICE:-cpu}"          # 有 GPU 改 cuda
  #     ASR_COMPUTE_TYPE: "${ASR_COMPUTE_TYPE:-int8}"  # 有 GPU 改 float16
  #     ASR_PRELOAD: "${ASR_PRELOAD:-1}"
  #     HF_ENDPOINT: "https://hf-mirror.com"
  #     HF_HUB_DISABLE_XET: "1"
  #   ports:
  #     - "8091:8090"
  #   networks:
  #     - appnet

volumes:
  postgres_data:
  uploads_data:

networks:
  appnet:
    driver: bridge
