<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：让页面延伸到刘海/圆角区域，配合 env(safe-area-inset-*) 使用安全区内边距 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AIDriveNote</title>
    <!-- 移动端添加到主屏后的运行形态（iOS Safari 读取 apple-* 系列） -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AIDriveNote" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- 关闭电话号码自动识别，避免笔记中的数字串被渲染成拨号链接 -->
    <meta name="format-detection" content="telephone=no" />
    <!-- 使用 %BASE_URL% 而非根绝对路径：子路径部署（/note/）时才能指向正确地址，
         否则深链页面与子路径模式下会 404 -->
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%icons/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />
    <!-- theme-color 分明暗两态，随系统深色模式切换系统栏配色；最后一条为不支持 media 的浏览器兜底 -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FF6B35" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111827" />
    <meta name="theme-color" content="#FF6B35" />
  </head>
  <body class="bg-gray-50 dark:bg-gray-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
