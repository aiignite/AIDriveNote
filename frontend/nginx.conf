server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 录音上传：浏览器录音为 webm，单条可能达数十 MB，放宽至 100m
    client_max_body_size 100m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service Worker 脚本与预缓存清单必须每次向服务器校验，
    # 一旦被长缓存，新版本 SW 与新的资源清单将永远无法生效。
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /sw-manifest.json {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE 唯一端点：必须关闭缓冲，否则事件会被攒在缓冲区里无法逐条下发。
    # 之所以单独开一条精确匹配，是因为 proxy_buffering off 会同时禁用 nginx 对
    # 上游响应的 gzip 压缩，作用于整个 /api/ 前缀会让普通 JSON 响应失去压缩。
    location = /api/v1/ai/chat/stream {
        proxy_pass http://backend:3275/api/v1/ai/chat/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
        proxy_set_header X-Accel-Buffering no;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    # 其余接口保持默认缓冲，让 gzip 生效（跨机房链路下体积收益明显）
    location /api/ {
        proxy_pass http://backend:3275/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /health {
        proxy_pass http://backend:3275/health;
    }
}
