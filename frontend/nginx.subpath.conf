server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    location = / {
        return 301 /note/;
    }

    location = /note {
        return 301 /note/;
    }

    location /note/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /note/icons/ {
        alias /usr/share/nginx/html/icons/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /note/favicon.ico {
        alias /usr/share/nginx/html/favicon.ico;
    }

    location = /note/apple-touch-icon.png {
        alias /usr/share/nginx/html/apple-touch-icon.png;
    }

    location = /note/site.webmanifest {
        alias /usr/share/nginx/html/site.webmanifest;
        default_type application/manifest+json;
    }

    # SSE 唯一端点：必须关闭缓冲（子路径模式下完整路径为 /note/api/v1/ai/chat/stream）。
    # 精确匹配只覆盖该端点，避免 proxy_buffering off 波及整个 /note/api/ 前缀而禁用 gzip。
    location = /note/api/v1/ai/chat/stream {
        proxy_pass http://backend:3275/api/v1/ai/chat/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_set_header X-Accel-Buffering no;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    # 其余接口保持默认缓冲，让 gzip 生效
    location /note/api/ {
        proxy_pass http://backend:3275/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /note/health {
        proxy_pass http://backend:3275/health;
    }

    location /note/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /note/index.html;
    }
}
