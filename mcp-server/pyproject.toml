[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aidrivenote-mcp"
version = "0.1.0"
description = "AIDriveNote MCP Server — 让外部 Agent 把检索到的文档写入 AIDriveNote 笔记"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "mcp>=1.2.0",
  "httpx>=0.27.0",
]

[project.scripts]
aidrivenote-mcp = "aidrivenote_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aidrivenote_mcp"]