# Host nginx: https://aiignite.com.cn/note -> AIDriveNote Docker :3270
# Install: sudo cp deploy/nginx/aiignite-note.conf /etc/nginx/sites-available/aiignite-note
#          sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name www.aiignite.com.cn aiignite.com.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.aiignite.com.cn aiignite.com.cn;

    ssl_certificate /etc/letsencrypt/live/www.aiignite.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.aiignite.com.cn/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location = / {
        return 301 https://$host/note/;
    }

    location = /note {
        return 301 https://$host/note/;
    }

    location /note/ {
        proxy_pass http://127.0.0.1:3270;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_set_header X-Accel-Buffering no;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
